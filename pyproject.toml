[project]
name = "pyobs-pipeline"
version = "0.1.0"
description = "Web-based monitoring and configuration for pyobs data reduction pipelines"
authors = [
    { name = "Tim-Oliver Husser", email = "thusser@uni-goettingen.de" },
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "gunicorn>=23.0",
    "celery>=5.4",
    "redis>=5.2",
    "astroplan>=0.10",
    "pyobs-core",
]

[tool.uv.sources]
# Points at the sibling checkout until the Night->Reduction rename (pyobs-core PR #743)
# ships in a released version on PyPI.
pyobs-core = { path = "../pyobs-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyobs_pipeline", "reduction"]
