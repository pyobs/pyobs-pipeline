[project]
name = "pyobs-pipeline"
version = "0.1.0"
description = "Web-based monitoring and configuration for pyobs data reduction pipelines"
authors = [
    { name = "Tim-Oliver Husser", email = "thusser@uni-goettingen.de" },
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "gunicorn>=23.0",
    "celery>=5.4",
    "redis>=5.2",
    "astroplan>=0.10",
    "pyobs-core[full]",
]

[tool.uv.sources]
# Pinned to a commit on pyobs-core's develop branch (public repo) rather than PyPI --
# the Night->Reduction rename (PR #743) this project depends on hasn't shipped in a
# release yet. Switch to a version pin once it does. A git source (not a local path)
# is required here so `uv sync` also works inside the Docker build, which has no
# sibling ../pyobs-core checkout in its build context.
#
# For local tandem development against an in-progress pyobs-core change, temporarily
# point this at { path = "../pyobs-core", editable = true } instead -- just don't
# commit that swap.
pyobs-core = { git = "https://github.com/pyobs/pyobs-core.git", rev = "f5e1c158" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyobs_pipeline", "reduction"]
