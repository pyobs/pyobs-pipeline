{% extends "base.html" %}
{% block title %}Delete {{ site.name }} — pyobs Pipeline{% endblock %}
{% block content %}
<h4 class="mb-3">Delete site "{{ site.name }}"?</h4>
<p class="text-muted">This also deletes its pipeline assignment and all reduction periods.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Delete</button>
  <a href="{% url 'site_detail' site.name %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
