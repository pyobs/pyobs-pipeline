<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}pyobs Pipeline{% endblock %}</title>
  <script>
    (function () {
      var stored = localStorage.getItem('pyobs-theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  {% block extra_head %}{% endblock %}
  <style>
    /* Theme-aware tokens - mirrors pyobs-archive's templates/base.html. */
    :root {
      --pyobs-surface-bg: #ffffff;
      --pyobs-surface-border: #dee2e6;
      --pyobs-surface-text: #212529;
      --pyobs-surface-text-muted: #6c757d;
      --pyobs-surface-hover-bg: #e9ecef;
      --pyobs-accent-bg: #0d6efd20;
      --pyobs-accent-text: #0a58ca;
    }
    [data-bs-theme="dark"] {
      --pyobs-surface-bg: #1a1d21;
      --pyobs-surface-border: #2d3035;
      --pyobs-surface-text: #dee2e6;
      --pyobs-surface-text-muted: #6c757d;
      --pyobs-surface-hover-bg: #2d3035;
      --pyobs-accent-bg: #0d6efd20;
      --pyobs-accent-text: #6ea8fe;
    }

    .app-chrome {
      background-color: var(--pyobs-surface-bg);
    }
    .sidebar {
      width: 240px;
      min-width: 240px;
      border-right: 1px solid var(--pyobs-surface-border);
      display: flex;
      flex-direction: column;
    }
    .sidebar-link {
      color: var(--pyobs-surface-text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      border-radius: 6px;
      transition: background-color 0.15s, color 0.15s;
    }
    .sidebar-link:hover  { background-color: var(--pyobs-surface-hover-bg); color: var(--pyobs-surface-text); }
    .sidebar-link.active { background-color: var(--pyobs-accent-bg); color: var(--pyobs-accent-text); }
    .main-content { min-width: 0; }
    @media (min-width: 992px) {
      body { overflow: hidden; }
      .sidebar      { height: 100vh; overflow-y: auto; }
      .main-content { height: 100vh; overflow-y: auto; }
    }
  </style>
</head>
<body>

<div class="d-flex">

  <nav class="sidebar app-chrome" id="sidebar">
    <div class="p-3 border-bottom border-secondary-subtle">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-diagram-3 fs-5 text-primary"></i>
        <div>
          <div class="fw-semibold text-body lh-1">pyobs</div>
          <div class="text-muted" style="font-size:0.7rem">Pipeline{% if pipeline_version %} v{{ pipeline_version }}{% endif %}</div>
        </div>
      </div>
    </div>

    <div class="p-2 flex-grow-1 overflow-auto">
      <div class="px-2 py-2">
        <a href="{% url 'dashboard' %}" class="sidebar-link d-flex align-items-center gap-2 px-2 py-2">
          <i class="bi bi-grid-fill" style="font-size:0.8rem"></i>
          Dashboard
        </a>
        <a href="{% url 'site_list' %}" class="sidebar-link d-flex align-items-center gap-2 px-2 py-2">
          <i class="bi bi-geo-alt-fill" style="font-size:0.8rem"></i>
          Sites
        </a>
        <a href="{% url 'pipeline_list' %}" class="sidebar-link d-flex align-items-center gap-2 px-2 py-2">
          <i class="bi bi-diagram-3-fill" style="font-size:0.8rem"></i>
          Pipelines
        </a>
        <a href="{% url 'period_list' %}" class="sidebar-link d-flex align-items-center gap-2 px-2 py-2">
          <i class="bi bi-list-check" style="font-size:0.8rem"></i>
          Periods
        </a>
      </div>
    </div>

    <div class="p-2 border-top border-secondary-subtle">
      <button type="button"
              class="sidebar-link d-flex align-items-center gap-2 px-2 py-2 w-100 border-0 bg-transparent text-start"
              onclick="toggleTheme()">
        <i class="theme-toggle-icon bi" style="font-size:0.8rem"></i>
        <span>Theme</span>
      </button>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit"
                class="sidebar-link d-flex align-items-center gap-2 px-2 py-2 w-100 border-0 bg-transparent text-start">
          <i class="bi bi-box-arrow-left" style="font-size:0.8rem"></i>
          <span>{{ request.session.username }}</span>
          <span class="ms-auto text-muted small">sign out</span>
        </button>
      </form>
    </div>
  </nav>

  <main class="main-content flex-grow-1 p-3 p-lg-4">
    {% block content %}{% endblock %}
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function currentTheme() {
    return document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'dark' : 'light';
  }
  function updateThemeIcons() {
    const dark = currentTheme() === 'dark';
    document.querySelectorAll('.theme-toggle-icon').forEach(icon => {
      icon.classList.toggle('bi-sun-fill', dark);
      icon.classList.toggle('bi-moon-stars-fill', !dark);
    });
  }
  function toggleTheme() {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-bs-theme', next);
    localStorage.setItem('pyobs-theme', next);
    updateThemeIcons();
  }
  updateThemeIcons();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
