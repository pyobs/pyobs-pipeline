<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}pyobs Pipeline{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  {% block extra_head %}{% endblock %}
  <style>
    .sidebar {
      width: 240px;
      min-width: 240px;
      background-color: #1a1d21;
      border-right: 1px solid #2d3035;
      display: flex;
      flex-direction: column;
    }
    .sidebar-link {
      color: #adb5bd;
      text-decoration: none;
      font-size: 0.875rem;
      border-radius: 6px;
      transition: background-color 0.15s, color 0.15s;
    }
    .sidebar-link:hover  { background-color: #2d3035; color: #f8f9fa; }
    .sidebar-link.active { background-color: #0d6efd20; color: #6ea8fe; }
    .main-content { min-width: 0; }
    @media (min-width: 992px) {
      body { overflow: hidden; }
      .sidebar      { height: 100vh; overflow-y: auto; }
      .main-content { height: 100vh; overflow-y: auto; }
    }
  </style>
</head>
<body>

<div class="d-flex">

  <nav class="sidebar" id="sidebar">
    <div class="p-3 border-bottom border-secondary-subtle">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-diagram-3 fs-5 text-primary"></i>
        <div>
          <div class="fw-semibold text-light lh-1">pyobs</div>
          <div class="text-muted" style="font-size:0.7rem">Pipeline</div>
        </div>
      </div>
    </div>

    <div class="p-2 flex-grow-1 overflow-auto">
      <div class="px-2 py-2">
        <a href="{% url 'dashboard' %}" class="sidebar-link d-flex align-items-center gap-2 px-2 py-2">
          <i class="bi bi-grid-fill" style="font-size:0.8rem"></i>
          Dashboard
        </a>
        <a href="{% url 'site_list' %}" class="sidebar-link d-flex align-items-center gap-2 px-2 py-2">
          <i class="bi bi-geo-alt-fill" style="font-size:0.8rem"></i>
          Sites
        </a>
        <a href="{% url 'pipeline_list' %}" class="sidebar-link d-flex align-items-center gap-2 px-2 py-2">
          <i class="bi bi-diagram-3-fill" style="font-size:0.8rem"></i>
          Pipelines
        </a>
      </div>
    </div>

    <div class="p-2 border-top border-secondary-subtle">
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit"
                class="sidebar-link d-flex align-items-center gap-2 px-2 py-2 w-100 border-0 bg-transparent text-start">
          <i class="bi bi-box-arrow-left" style="font-size:0.8rem"></i>
          <span>{{ request.session.username }}</span>
          <span class="ms-auto text-muted small">sign out</span>
        </button>
      </form>
    </div>
  </nav>

  <main class="main-content flex-grow-1 p-3 p-lg-4">
    {% block content %}{% endblock %}
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
